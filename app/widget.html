<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Zoho Desk Account Widget</title>
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
   <link rel="stylesheet" href="./css/style.css">
</head>

<body>
   <div class="account-widget">
       <div class="account-header" id="accountHeader" role="button" tabindex="0" aria-expanded="false" aria-controls="accountContent">
           <span class="account-title">Account</span>
           <span class="account-toggle" aria-hidden="true">
               <i class="bi bi-chevron-down"></i>
           </span>
       </div>

       <div class="account-content" id="accountContent" aria-hidden="true">
           <div class="state-loading" id="stateLoading" style="display: none;">
               <div class="spinner-border spinner-border-sm" role="status" aria-live="polite" aria-label="Loading account details">
                   <span class="visually-hidden">Loading...</span>
               </div>
               <span>Loading account details...</span>
           </div>

           <div class="state-success" id="stateSuccess" style="display: none;">
               <div class="account-details">
                   <div class="detail-row">
                       <span class="detail-label">Account Name</span>
                       <span class="detail-value" id="detailAccountName">—</span>
                   </div>
                   <div class="detail-row">
                       <span class="detail-label">Account Type</span>
                       <span class="detail-value" id="detailAccountType">—</span>
                   </div>
                   <div class="detail-row">
                       <span class="detail-label">Email</span>
                       <span class="detail-value" id="detailEmail">—</span>
                   </div>
                   <div class="detail-row">
                       <span class="detail-label">Phone</span>
                       <span class="detail-value" id="detailPhone">—</span>
                   </div>
                   <div class="detail-row">
                       <span class="detail-label">Website</span>
                       <span class="detail-value" id="detailWebsite">—</span>
                   </div>
                   <div class="detail-row">
                       <span class="detail-label">Address</span>
                       <span class="detail-value" id="detailAddress">—</span>
                   </div>
                   <div class="detail-row">
                       <span class="detail-label">Created Time</span>
                       <span class="detail-value" id="detailCreatedTime">—</span>
                   </div>
                   <div class="detail-row">
                       <span class="detail-label">Layout</span>
                       <span class="detail-value" id="detailLayout">—</span>
                   </div>
                   <div class="detail-row detail-description">
                       <span class="detail-label">Description</span>
                       <span class="detail-value" id="detailDescription">—</span>
                   </div>
                   <div class="detail-row">
                       <span class="detail-label">Account Owner</span>
                       <span class="detail-value" id="detailAccountOwner">—</span>
                   </div>
                   
                   
               </div>
           </div>

           <div class="state-no-account" id="stateNoAccount" style="display: none;">
               <p>No account associated with this ticket.</p>
           </div>

           <div class="state-error" id="stateError" style="display: none;">
               <p id="errorMessage">Unable to load account details.</p>
               <button class="btn btn-sm btn-outline-secondary" id="retryButton" type="button">
                   <i class="bi bi-arrow-clockwise"></i> Retry
               </button>
           </div>
       </div>
   </div>

   <script src="https://static.zohocdn.com/zohodeskmarketplacesdkstatic/developer_sdk/v1/js/ZohoDeskClientSDK.min.js"></script>
   <script src="./js/Ui.js"></script>
   <script src="./js/extension.js"></script>
</body>

</html>
